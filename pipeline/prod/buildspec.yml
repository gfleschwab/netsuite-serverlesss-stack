version: 0.2
env:
  variables:
    CFN_STACK_NAME: "aws-glue-template-cicd"
    CFN_TEMPLATE: "codepipeline-aws-glue-template-cicd.yml"
    REGION: "us-west-2"
phases:
  pre_build:
    commands:
      # - echo running pre_build commands
      # - echo Validating template
      # - chmod +x scripts/template_validate.sh
      # - scripts/template_validate.sh
  build:
    commands:
      - echo "building"
      - aws cloudformation package --template-file "$CFN_TEMPLATE" --s3-bucket lsprod-cicd  --output-template-file sam-lambda-cloudformation.yaml --region us-west-2
      - aws cloudformation deploy --template-file "$CFN_TEMPLATE" --stack-name "$CFN_STACK_NAME" --capabilities CAPABILITY_NAMED_IAM --region "$REGION" --tags 'Portfolio Owner=RAD' 'OS=CloudFormation Stack' 'Project=project-name' 'Application=Application Name' 'Data Classification=Confidential - NPI' 'Exposure=Internal' 'Environment=prod' 'Createdby_VersionID=developer name'
