# cloudformation/resources.yml
Resources:

  GlueJobRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: NetSuiteGlueJobRole-${self:custom.stage}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: [glue.amazonaws.com] }
            Action: [sts:AssumeRole]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: GlueJobCustomPermissions-${self:custom.stage}
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: "Allow"
                Action: ["s3:GetObject"]
                Resource:
                  - "arn:aws:s3:::${self:custom.config.assetBucketName}/glue-scripts/netsuite2-historical-load.py"
              - Effect: "Allow"
                Action: ["s3:PutObject", "s3:DeleteObject"]
                Resource: "arn:aws:s3:::${self:custom.config.outputBucketName}/*"
              - Effect: "Allow"
                Action: ["s3:ListBucket"]
                Resource: "arn:aws:s3:::${self:custom.config.outputBucketName}"
              - Effect: "Allow"
                Action: ["secretsmanager:GetSecretValue"]
                Resource: "arn:aws:secretsmanager:${self:provider.region}:${aws:accountId}:secret:${self:custom.config.secretName}-*"

              - Effect: "Allow"
                Action:
                  - "ec2:CreateNetworkInterface"
                  - "ec2:DescribeNetworkInterfaces"
                  - "ec2:DeleteNetworkInterface"
                  - "ec2:AssignPrivateIpAddresses"
                  - "ec2:UnassignPrivateIpAddresses"
                Resource: "*"

  NetsuiteTransactionEtlJob:
    Type: AWS::Glue::Job
    Properties:
      Name: ${self:custom.config.glueJobName}
      Role: !GetAtt GlueJobRole.Arn
      Command:
        Name: glueetl
        ScriptLocation: "s3://${self:custom.config.assetBucketName}/glue-scripts/netsuite2-historical-load.py"
        PythonVersion: "3"
      GlueVersion: "4.0"
      WorkerType: "G.1X"
      NumberOfWorkers: 10
      ExecutionClass: "FLEX"
      DefaultArguments:
        "--TempDir": "s3://${self:custom.config.outputBucketName}/temporary/"
        "--job-language": "python"
        "--additional-python-modules": "requests_oauthlib==1.3.1,pandas==1.5.3"
        "--enable-metrics": ""
        "--secret_name": ${self:custom.config.secretName}
      Tags:
        Portfolio Owner: Integrations

  StepFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: NetsuiteEtlStepFunctionsRole-${self:custom.stage}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: [states.amazonaws.com] }
            Action: [sts:AssumeRole]
      Policies:
        - PolicyName: StepFunctionsPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - "lambda:InvokeFunction"
                  - "states:SendTaskSuccess"
                  - "states:SendTaskFailure"
                Resource:
                  - "arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:service}-${self:custom.stage}-dateGenerator"
                  - "arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:service}-${self:custom.stage}-triggerNetsuiteEtl"
                  - "*"

  HistoricalLoadStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: netsuite
      DefinitionString: |-
        {
          "Comment": "AWS Step Function to run daily Glue jobs with a lower max concurrency to avoid rate limits.",
          "StartAt": "GenerateMonthlyChunks",
          "States": {
            "GenerateMonthlyChunks": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:service}-${self:custom.stage}-dateGenerator",
                "Payload": {
                  "startDate.$": "$.startDate",
                  "endDate.$": "$.endDate"
                }
              },
              "ResultPath": "$.monthlyChunks",
              "Next": "ProcessMonthlyChunks"
            },
            "ProcessMonthlyChunks": {
              "Type": "Map",
              "ItemsPath": "$.monthlyChunks.Payload",
              "MaxConcurrency": 1,
              "Iterator": {
                "StartAt": "GenerateDailyDates",
                "States": {
                  "GenerateDailyDates": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::lambda:invoke",
                    "Parameters": {
                      "FunctionName": "arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:service}-${self:custom.stage}-dateGenerator",
                      "Payload": {
                        "startDate.$": "$.startDate",
                        "endDate.$": "$.endDate"
                      }
                    },
                    "ResultPath": "$.dailyDates",
                    "Next": "ProcessDailyJobs"
                  },
                  "ProcessDailyJobs": {
                    "Type": "Map",
                    "ItemsPath": "$.dailyDates.Payload",
                    "MaxConcurrency": 1,
                    "Iterator": {
                      "StartAt": "StartDailyGlueJob",
                      "States": {
                        "StartDailyGlueJob": {
                          "Type": "Task",
                          "Resource": "arn:aws:states:::lambda:invoke.waitForTaskToken",
                          "Parameters": {
                            "FunctionName": "arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:service}-${self:custom.stage}-triggerNetsuiteEtl",
                            "Payload": {
                              "startDate.$": "$.startDate",
                              "endDate.$": "$.endDate",
                              "TaskToken.$": "$$.Task.Token"
                            }
                          },
                          "Catch": [
                            {
                              "ErrorEquals": [
                                "States.TaskFailed"
                              ],
                              "Next": "FailState"
                            }
                          ],
                          "End": true
                        },
                        "FailState": {
                          "Type": "Fail",
                          "Cause": "Glue job failed",
                          "Error": "JobRunFailed"
                        }
                      }
                    },
                    "End": true
                  }
                }
              },
              "End": true
            }
          }
        }
      RoleArn: !GetAtt StepFunctionsRole.Arn
      Tags:
        - Key: Portfolio Owner
          Value: Integrations